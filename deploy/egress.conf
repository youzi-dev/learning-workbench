# Enforced configuration, implemented by egress.ts and egress-guard.sh:
# - only CONNECT destination:443; hostname resolved on every tunnel
# - reject every nonpublic DNS answer, including IPv6/mapped/metadata
# - connect to the validated IP literal, no resolver call after validation
# - namespace OUTPUT default DROP IPv4+IPv6; only proxy-IP:3128 permitted
# - proxy has external network; worker has isolated namespace, UID 10001,
#   no capabilities, no persistent volumes, readonly root, bounded tmpfs
# - job URL is bounded stdin, never a container argument or environment value
listen=3128
https_only=true
max_connections=64

# DNS transport is fixed public DoH: TLS cloudflare-dns.com, socket 1.1.1.1:443.
# A/AAAA JSON responses <=64KiB and <=10s; all answers revalidated per CONNECT.
# Workstation fake-IP/reserved DNS results never become allowed destinations.
dns_transport=public-doh-pinned
dns_tls_name=cloudflare-dns.com
dns_socket_ip=1.1.1.1
